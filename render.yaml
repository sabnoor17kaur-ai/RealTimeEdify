services:
  - type: web
    name: realtimeedify
    runtime: node
    rootDir: src
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL
        sync: false
      - key: PASSWORD
        sync: false
